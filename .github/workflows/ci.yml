name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Module boundaries are checked while Gradle configures the build, so any step fails on a violation.
      - name: Build logic tests
        run: ./gradlew -p build-logic test

      - name: Kotlin style check
        run: ./gradlew ktlintCheck

      - name: Static analysis
        run: ./gradlew detekt lint

      - name: Unit tests
        run: ./gradlew test

      - name: Assemble APKs
        run: ./gradlew assembleDebug assembleRelease
